name: Publish To OHPM

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 1.2.3 or 2026.3.26). Leave empty to use tag name."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build only, skip ohpm publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: harmony-ohpm-publish-${{ github.repository }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - ${{ vars.NEPTUNE_HARMONY_RUNNER_LABEL || 'neptune-harmony-release' }}
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_input="${{ inputs.version }}"
          version_name="${version_input}"

          if [[ -z "${version_name}" ]]; then
            if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
              echo "workflow_dispatch from branch requires inputs.version" >&2
              exit 1
            fi
            version_name="${GITHUB_REF_NAME}"
          fi

          version_name="${version_name#v}"

          if [[ ! "${version_name}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]] && [[ ! "${version_name}" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$ ]]; then
            echo "invalid version: ${version_name}" >&2
            exit 1
          fi

          printf 'version_name=%s\n' "${version_name}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: resolve-version
    environment:
      name: harmony-release
    uses: NeptuneKit/.github/.github/workflows/ohpm-publish.yml@main
    with:
      version: ${{ needs.resolve-version.outputs.version_name }}
      dry_run: ${{ inputs.dry_run || false }}
      build_command: bash scripts/ci/build-ohpm-har.sh "${{ needs.resolve-version.outputs.version_name }}"
      har_glob: library/build/**/*.har
      license_path: library/LICENSE
      readme_path: library/README.md
      changelog_path: library/changelog.md
      publish_registry: https://ohpm.openharmony.cn/ohpm/
      environment_name: harmony-release
      runner_label: ${{ vars.NEPTUNE_HARMONY_RUNNER_LABEL || 'neptune-harmony-release' }}
    secrets: inherit
